[project]
name = "items-api"
version = "0.1.0"
description = "The Items API (software/api-testing/openapi/items-api.yaml) in FastAPI."
readme = "README.md"
requires-python = ">=3.12"
license = "CC-BY-4.0"
dependencies = [
    "fastapi>=0.143",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",  # what FastAPI's TestClient uses (Starlette deprecated plain httpx for it)
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
