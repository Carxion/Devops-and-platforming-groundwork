[project]
name = "healthcheck"
version = "0.1.0"
description = "Check that HTTP endpoints answer with the expected status, in parallel."
readme = "README.md"
requires-python = ">=3.12"
license = "CC-BY-4.0"
# Standard library only: nothing to install at run time, nothing to patch.
dependencies = []

[project.scripts]
healthcheck = "healthcheck.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade,
# S bandit (security), SIM simplify, RUF ruff-specific.
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest tests work.
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
