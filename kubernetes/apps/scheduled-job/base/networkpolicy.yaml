apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scheduled-job
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: scheduled-job
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
