apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-aws-credentials-egress
spec:
  podSelector:
    matchLabels:
      sample-apps/aws-credentials: "true"
  policyTypes: ["Egress"]
  egress:
    # The EKS Pod Identity agent on each node.
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - protocol: TCP
          port: 80
    # AWS APIs. Narrow to VPC endpoint subnets where you use them.
    - ports:
        - protocol: TCP
          port: 443
