version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Provider versions in each stack's lock file. Constraints stay "~> X.Y";
  # review the provider changelog before merging.
  - package-ecosystem: terraform
    directories: ["/devops/terraform/aws/*", "/devops/terraform/azure/*"]
    schedule:
      interval: monthly
    groups:
      terraform-providers:
        patterns: ["*"]

  # Base images in the example Dockerfiles (pinned by tag and digest).
  - package-ecosystem: docker
    directories: ["/devops/docker/examples/items-api", "/devops/docker/examples/go-hello", "/software/python/boilerplate/items-api", "/software/go/boilerplate/items-api"]
    schedule:
      interval: monthly
    groups:
      base-images:
        patterns: ["*"]

  # Ansible's pinned control-node tools.
  - package-ecosystem: pip
    directory: /devops/ansible
    schedule:
      interval: monthly
    groups:
      ansible:
        patterns: ["*"]

  # Python dependencies in the boilerplate and examples projects' uv.lock files.
  - package-ecosystem: uv
    directories: ["/software/python/boilerplate/healthcheck", "/software/python/boilerplate/items-api", "/software/python/examples"]
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]

  # Go version and modules in the boilerplate and examples modules.
  - package-ecosystem: gomod
    directories: ["/software/go/boilerplate/healthcheck", "/software/go/boilerplate/items-api", "/software/go/examples"]
    schedule:
      interval: monthly
