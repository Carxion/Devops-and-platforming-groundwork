name: terraform

on:
  push:
    branches: [main]
    paths: ["devops/terraform/**", ".github/workflows/terraform.yml"]
  pull_request:
    paths: ["devops/terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "1"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

jobs:
  # fmt, validate, and offline tests (mock providers). No cloud credentials.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive -diff terraform
      - name: Validate and test each stack
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          status=0
          for dir in $(find devops/terraform -name versions.tf -exec dirname {} \; | sort); do
            echo "::group::$dir"
            if ! (cd "$dir" \
                  && terraform init -backend=false -input=false -lockfile=readonly \
                  && terraform validate \
                  && terraform test); then
              echo "::error::$dir failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - name: Lint
        working-directory: devops/terraform
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading rulesets
        run: |
          tflint --init
          tflint --recursive --config "$(pwd)/.tflint.hcl" --format compact

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every skip is an inline #checkov:skip comment with its reason, next to
      # the resource it applies to.
      - uses: bridgecrewio/checkov-action@c13aafd679d3814a25067d10fcaf98c4f7594931 # v12.3131.0
        with:
          directory: devops/terraform
          framework: terraform
          quiet: true
          soft_fail: false
