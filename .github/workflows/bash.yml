name: bash

# Lints every script in bash/ and docker/scripts, runs the Bats unit and
# regex tests, then applies the full server baseline for real inside
# throwaway containers of each supported distribution, twice (idempotency).

on:
  push:
    branches: [main]
    paths: ["bash/**", "docker/scripts/**", ".github/workflows/bash.yml"]
  pull_request:
    paths: ["bash/**", "docker/scripts/**", ".github/workflows/bash.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bash-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0
  SHFMT_IMAGE: mvdan/shfmt:v3.14.1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        # Globs expand on the runner, so paths are relative to the repository root.
        # SCRIPTDIR: resolve "source lib/common.sh" relative to each script.
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt "$SHELLCHECK_IMAGE" -x -P SCRIPTDIR \
            bash/scripts/*.sh bash/scripts/lib/*.sh bash/tests/integration.sh docker/scripts/*.sh
      - name: shfmt
        run: docker run --rm -v "$PWD:/mnt" -w /mnt "$SHFMT_IMAGE" -d -i 2 -ci bash/scripts bash/tests/integration.sh docker/scripts

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats netcat-openbsd
      - name: Bats (as a normal user, as the scripts expect)
        run: bats bash/tests

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - ubuntu:22.04
          - rockylinux/rockylinux:9
          - almalinux:9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Baseline applied twice in ${{ matrix.image }}
        run: docker run --rm -v "$PWD/bash:/work:ro" "${{ matrix.image }}" bash /work/tests/integration.sh

  dry-run:
    # UBI (Red Hat's redistributable RHEL base) has a subset of RHEL's
    # packages without a subscription, so it gets a dry run of every step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dry run on UBI 9
        run: |
          ssh-keygen -q -t ed25519 -N '' -f key -C ci
          docker run --rm -v "$PWD/bash:/work:ro" -v "$PWD/key.pub:/key.pub:ro" registry.access.redhat.com/ubi9/ubi:latest \
            bash /work/scripts/bootstrap-server.sh --dry-run --admin-user deploy --ssh-key-file /key.pub --allow 443/tcp --docker
