name: api-testing

# Lints the Items API spec, then runs every test in software/api-testing/ against the
# local reference server: Newman (functional), Schemathesis (contract and
# fuzz), k6 (smoke), and a short Locust run. No cloud resources are used.

on:
  push:
    branches: [main]
    paths:
      - "software/api-testing/**"
      - "devops/terraform/aws/serverless-api/src/**"
      - "devops/terraform/azure/functions-api/src/**"
      - ".github/workflows/api-testing.yml"
  pull_request:
    paths:
      - "software/api-testing/**"
      - "devops/terraform/aws/serverless-api/src/**"
      - "devops/terraform/azure/functions-api/src/**"
      - ".github/workflows/api-testing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-testing-${{ github.ref }}
  cancel-in-progress: true

env:
  SPECTRAL_VERSION: 6.17.0
  NEWMAN_VERSION: 6.2.3
  SCHEMATHESIS_VERSION: 4.31.0
  LOCUST_VERSION: 2.46.7
  K6_VERSION: v2.3.0
  K6_SHA256: 39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1

defaults:
  run:
    working-directory: software/api-testing

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Spectral
        run: npx --yes "@stoplight/spectral-cli@${SPECTRAL_VERSION}" lint openapi/items-api.yaml --fail-severity warn

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install tools
        run: |
          pip install --quiet "schemathesis==${SCHEMATHESIS_VERSION}" "locust==${LOCUST_VERSION}"
          curl -fsSLo k6.tar.gz "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz"
          echo "${K6_SHA256}  k6.tar.gz" | sha256sum --check
          sudo tar -xzf k6.tar.gz --strip-components=1 -C /usr/local/bin "k6-${K6_VERSION}-linux-amd64/k6"
          rm k6.tar.gz
      - name: Start the reference server
        run: |
          nohup python local-server/items_server.py --port 8080 > server.log 2>&1 &
          for _ in $(seq 20); do curl -s -o /dev/null http://127.0.0.1:8080/items/ready && exit 0; sleep 0.5; done
          cat server.log; exit 1
      - name: Newman (functional)
        run: |
          npx --yes "newman@${NEWMAN_VERSION}" run postman/items-api.postman_collection.json \
            -e postman/environments/local.postman_environment.json --reporters cli,junit --reporter-junit-export newman.xml
      - name: Schemathesis (contract and fuzz)
        run: schemathesis run openapi/items-api.yaml --url http://127.0.0.1:8080 --checks all
      - name: k6 (smoke)
        run: k6 run --quiet k6/smoke.js
      - name: Locust (short run)
        run: locust -f locust/locustfile.py --config locust/locust.conf --host http://127.0.0.1:8080 --users 5 --spawn-rate 5 --run-time 15s --exit-code-on-error 1
      - name: Server log
        if: failure()
        run: cat server.log
