name: cli-commands

# Checks every aws and az command in the Markdown against the real CLIs:
# operations, flags, and --query expressions. Catches renamed commands and
# removed flags before readers hit them. No cloud credentials are used.

on:
  push:
    branches: [main]
    paths: ["**/*.md", "scripts/check_cli_commands.py", ".github/workflows/cli-commands.yml"]
  pull_request:
    paths: ["**/*.md", "scripts/check_cli_commands.py", ".github/workflows/cli-commands.yml"]
  schedule:
    - cron: "41 6 * * 1" # weekly: CLIs change even when the docs don't
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-commands-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install CLIs
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet "awscli==1.46.1" "azure-cli==2.91.0"
          for ext in resource-graph log-analytics application-insights bastion serial-console load amg scheduled-query; do
            .venv/bin/python -m azure.cli extension add --name "$ext" --only-show-errors
          done
      - name: Check commands
        env:
          AWS_V2_BIN: /usr/local/bin/aws # AWS CLI v2, preinstalled on GitHub-hosted runners
        run: .venv/bin/python scripts/check_cli_commands.py
