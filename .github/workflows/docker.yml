name: docker

# Lints the example Dockerfiles, builds them, scans the images, and runs the
# Compose example end to end: hardened services, health-checked startup, and
# the api-testing k6 smoke test against the items API.

on:
  push:
    branches: [main]
    paths: ["devops/docker/**", "software/api-testing/local-server/**", "software/api-testing/k6/**", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["devops/docker/**", "software/api-testing/local-server/**", "software/api-testing/k6/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1
  TRIVY_IMAGE: aquasec/trivy:0.75.0

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Hadolint
        run: |
          for f in devops/docker/examples/*/Dockerfile; do
            echo "::group::$f"
            docker run --rm -i "$HADOLINT_IMAGE" hadolint - < "$f"
            echo "::endgroup::"
          done
      - name: Compose file
        run: docker compose -f devops/docker/examples/compose.yaml config --quiet
      - name: Build, run, and smoke test
        run: docker compose -f devops/docker/examples/compose.yaml up --build --exit-code-from smoke-test
      - name: Every service stopped cleanly (no SIGKILL on shutdown)
        run: |
          docker compose -f devops/docker/examples/compose.yaml ps -a --format '{{.Service}} {{.ExitCode}}'
          bad=$(docker compose -f devops/docker/examples/compose.yaml ps -a --format '{{.Service}} {{.ExitCode}}' | awk '$2 != 0')
          if [ -n "$bad" ]; then echo "Non-zero exit: $bad"; exit 1; fi
      - name: Images run as non-root
        run: |
          for image in docker-101/items-api:local docker-101/go-hello:local; do
            user=$(docker image inspect --format '{{.Config.User}}' "$image")
            echo "$image user=$user"
            case "$user" in "" | root | 0 | 0:*) exit 1 ;; esac
          done
      - name: Trivy (fail on fixable HIGH and CRITICAL)
        run: |
          for image in docker-101/items-api:local docker-101/go-hello:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: Audit the running containers
        run: |
          docker compose -f devops/docker/examples/compose.yaml up -d items-api go-hello
          bash devops/docker/scripts/docker-audit.sh --strict
      - name: Clean up
        if: always()
        run: docker compose -f devops/docker/examples/compose.yaml down -v
