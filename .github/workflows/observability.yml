name: observability

# Checks everything in devops/observability/: Prometheus rules (lint and unit tests),
# Alertmanager and OpenTelemetry Collector configs, dashboard JSON, and then
# the whole local lab, started with Docker Compose and checked end to end.
# The CloudFormation and Bicep templates are checked by cloud-templates.yml.

on:
  push:
    branches: [main]
    paths: ["devops/observability/**", "scripts/check_observability_lab.py", ".github/workflows/observability.yml"]
  pull_request:
    paths: ["devops/observability/**", "scripts/check_observability_lab.py", ".github/workflows/observability.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with devops/observability/local-stack/compose.yaml.
  PROMETHEUS_IMAGE: prom/prometheus:v3.15.0
  ALERTMANAGER_IMAGE: prom/alertmanager:v0.34.1
  OTELCOL_IMAGE: otel/opentelemetry-collector-contrib:0.162.0

jobs:
  configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: promtool check and test rules
        run: |
          docker run --rm -v "$PWD/devops/observability:/o:ro" --entrypoint promtool "$PROMETHEUS_IMAGE" \
            check rules /o/prometheus/rules/web-app-slo.yaml
          docker run --rm -v "$PWD/devops/observability:/o:ro" -w /o/prometheus/tests --entrypoint promtool "$PROMETHEUS_IMAGE" \
            test rules web-app-slo.test.yaml
      - name: promtool check config
        # Mount the rules where prometheus.yml expects them.
        run: |
          docker run --rm \
            -v "$PWD/devops/observability/local-stack/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/devops/observability/prometheus/rules:/etc/prometheus/rules:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml
      - name: amtool check-config
        run: |
          docker run --rm -v "$PWD/devops/observability/local-stack/alertmanager.yml:/a.yml:ro" \
            --entrypoint amtool "$ALERTMANAGER_IMAGE" check-config /a.yml
      - name: OpenTelemetry Collector validate
        run: |
          docker run --rm -v "$PWD/devops/observability/local-stack/otel-collector.yaml:/c.yaml:ro" \
            "$OTELCOL_IMAGE" validate --config=/c.yaml
      - name: Compose file
        run: docker compose -f devops/observability/local-stack/compose.yaml --profile traffic config --quiet
      - name: Dashboard JSON
        # Valid JSON, unique dashboard uids and panel ids, and only provisioned data source uids.
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          import yaml  # preinstalled on GitHub-hosted runners
          ds = yaml.safe_load(open("devops/observability/local-stack/grafana/provisioning/datasources/datasources.yaml"))
          known = {d["uid"] for d in ds["datasources"]}
          seen, problems = set(), []
          for path in sorted(pathlib.Path("devops/observability/grafana/dashboards").glob("*.json")):
              d = json.loads(path.read_text())
              if d["uid"] in seen:
                  problems.append(f"{path}: duplicate dashboard uid {d['uid']}")
              seen.add(d["uid"])
              ids = [p["id"] for p in d["panels"]]
              if len(ids) != len(set(ids)):
                  problems.append(f"{path}: duplicate panel ids")
              for p in d["panels"]:
                  uid = p.get("datasource", {}).get("uid")
                  if uid not in known:
                      problems.append(f"{path}: panel {p['id']} uses unknown data source uid {uid}")
          print("\n".join(problems) or f"{len(seen)} dashboards OK")
          sys.exit(1 if problems else 0)
          EOF

  lab:
    runs-on: ubuntu-latest
    needs: configs
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the lab
        run: docker compose -f devops/observability/local-stack/compose.yaml --profile traffic up -d --quiet-pull
      - name: Check metrics, traces, logs, dashboards, and alerts
        run: python3 scripts/check_observability_lab.py --timeout 600
      - name: Logs on failure
        if: failure()
        run: docker compose -f devops/observability/local-stack/compose.yaml --profile traffic logs --tail 100
      - name: Stop the lab
        if: always()
        run: docker compose -f devops/observability/local-stack/compose.yaml --profile traffic down -v
