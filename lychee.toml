# Link checker config: https://lychee.cli.rs
# Some sites rate-limit or block datacenter IPs
# such as GitHub runners. Treat those responses as reachable rather than broken.
accept = ["200..=299", "403", "429"]
max_retries = 3
retry_wait_time = 5
timeout = 30
include_fragments = "anchor-only"
exclude_path = ["LICENSE", "node_modules", "platform-engineering/examples/out"]
# Relative links into GitHub's issue UI only resolve on github.com.
exclude = ["issues/new"]
# localhost URLs point at the observability lab and local servers, which run only on your machine.
exclude_loopback = true
