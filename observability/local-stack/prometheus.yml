global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yaml # ../prometheus/rules, the SLO rules

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The application. In Kubernetes, a ServiceMonitor or pod annotations
  # replace this static target; keep job="web-app" so the SLO rules match.
  - job_name: web-app
    static_configs:
      - targets: ["web-app:9797"]

  # The observability stack watches itself, too.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
