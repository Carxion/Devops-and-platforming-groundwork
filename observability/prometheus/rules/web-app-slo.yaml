# SLOs for the web-app sample (kubernetes/apps/web-app, podinfo), as
# Prometheus recording rules and multiwindow, multi-burn-rate alerts.
# Method: Google SRE Workbook, "Alerting on SLOs":
#   https://sre.google/workbook/alerting-on-slos/
#
# SLOs, over 30 days:
#   availability  99.9% of requests don't fail with a 5xx error
#   latency       99% of requests complete in under 250 ms
# Health checks (healthz, readyz) are excluded: they aren't user traffic.
#
# Test: promtool test rules observability/prometheus/tests/web-app-slo.test.yaml
#
# To reuse for another service, change the job selector and thresholds. With
# the Prometheus Operator, wrap the groups in a PrometheusRule object; Amazon
# Managed Service for Prometheus accepts this file as a rule groups namespace.

groups:
  - name: web-app-sli
    interval: 30s
    rules:
      # Share of requests that failed (5xx), over each alerting window.
      - record: job:slo_availability_errors:ratio_rate5m
        expr: |
          sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz", status=~"5.."}[5m]))
          /
          sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz"}[5m]))
      - record: job:slo_availability_errors:ratio_rate30m
        expr: |
          sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz", status=~"5.."}[30m]))
          /
          sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz"}[30m]))
      - record: job:slo_availability_errors:ratio_rate1h
        expr: |
          sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz", status=~"5.."}[1h]))
          /
          sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz"}[1h]))
      - record: job:slo_availability_errors:ratio_rate2h
        expr: |
          sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz", status=~"5.."}[2h]))
          /
          sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz"}[2h]))
      - record: job:slo_availability_errors:ratio_rate6h
        expr: |
          sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz", status=~"5.."}[6h]))
          /
          sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz"}[6h]))
      - record: job:slo_availability_errors:ratio_rate1d
        expr: |
          sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz", status=~"5.."}[1d]))
          /
          sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz"}[1d]))
      - record: job:slo_availability_errors:ratio_rate3d
        expr: |
          sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz", status=~"5.."}[3d]))
          /
          sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz"}[3d]))

      # Share of requests slower than 250 ms (the le="0.25" histogram bucket).
      - record: job:slo_latency_errors:ratio_rate5m
        expr: |
          1 - (
            sum by (job) (rate(http_request_duration_seconds_bucket{job="web-app", path!~"healthz|readyz", le="0.25"}[5m]))
            /
            sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz"}[5m]))
          )
      - record: job:slo_latency_errors:ratio_rate30m
        expr: |
          1 - (
            sum by (job) (rate(http_request_duration_seconds_bucket{job="web-app", path!~"healthz|readyz", le="0.25"}[30m]))
            /
            sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz"}[30m]))
          )
      - record: job:slo_latency_errors:ratio_rate1h
        expr: |
          1 - (
            sum by (job) (rate(http_request_duration_seconds_bucket{job="web-app", path!~"healthz|readyz", le="0.25"}[1h]))
            /
            sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz"}[1h]))
          )
      - record: job:slo_latency_errors:ratio_rate2h
        expr: |
          1 - (
            sum by (job) (rate(http_request_duration_seconds_bucket{job="web-app", path!~"healthz|readyz", le="0.25"}[2h]))
            /
            sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz"}[2h]))
          )
      - record: job:slo_latency_errors:ratio_rate6h
        expr: |
          1 - (
            sum by (job) (rate(http_request_duration_seconds_bucket{job="web-app", path!~"healthz|readyz", le="0.25"}[6h]))
            /
            sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz"}[6h]))
          )
      - record: job:slo_latency_errors:ratio_rate1d
        expr: |
          1 - (
            sum by (job) (rate(http_request_duration_seconds_bucket{job="web-app", path!~"healthz|readyz", le="0.25"}[1d]))
            /
            sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz"}[1d]))
          )
      - record: job:slo_latency_errors:ratio_rate3d
        expr: |
          1 - (
            sum by (job) (rate(http_request_duration_seconds_bucket{job="web-app", path!~"healthz|readyz", le="0.25"}[3d]))
            /
            sum by (job) (rate(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz"}[3d]))
          )

      # Error budget left this 30-day window: 1 = untouched, 0 = spent, below 0 = SLO missed.
      - record: job:slo_availability_error_budget:remaining30d
        expr: |
          1 - (
            (
              sum by (job) (increase(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz", status=~"5.."}[30d]))
              /
              sum by (job) (increase(http_request_duration_seconds_count{job="web-app", path!~"healthz|readyz"}[30d]))
            ) / 0.001
          )

  - name: web-app-slo-alerts
    rules:
      # Burn rate = error ratio / error budget. At 14.4x, a 30-day budget is
      # gone in about 2 days; at 1x, exactly at the end of the 30 days. Each
      # alert needs both a long window (the burn is significant) and a short
      # one (it's still happening), so alerts stop soon after a fix.
      - alert: WebAppAvailabilityBudgetBurn
        expr: |
          (job:slo_availability_errors:ratio_rate1h > (14.4 * 0.001) and job:slo_availability_errors:ratio_rate5m > (14.4 * 0.001))
          or
          (job:slo_availability_errors:ratio_rate6h > (6 * 0.001) and job:slo_availability_errors:ratio_rate30m > (6 * 0.001))
        for: 2m
        labels:
          severity: page
          slo: availability
        annotations:
          summary: "web-app is failing requests fast enough to spend its monthly error budget within days"
          description: "{{ $value | humanizePercentage }} of requests are failing with 5xx errors (SLO allows 0.1%)."
          runbook_url: "https://github.com/Carxion/Devops-and-platforming-groundwork/blob/main/kubernetes/OPERATIONS.md#troubleshooting-by-symptom"

      - alert: WebAppAvailabilityBudgetBurn
        expr: |
          (job:slo_availability_errors:ratio_rate1d > (3 * 0.001) and job:slo_availability_errors:ratio_rate2h > (3 * 0.001))
          or
          (job:slo_availability_errors:ratio_rate3d > (1 * 0.001) and job:slo_availability_errors:ratio_rate6h > (1 * 0.001))
        for: 15m
        labels:
          severity: ticket
          slo: availability
        annotations:
          summary: "web-app is slowly spending its error budget faster than it accrues"
          description: "{{ $value | humanizePercentage }} of requests are failing with 5xx errors (SLO allows 0.1%)."
          runbook_url: "https://github.com/Carxion/Devops-and-platforming-groundwork/blob/main/kubernetes/OPERATIONS.md#troubleshooting-by-symptom"

      - alert: WebAppLatencyBudgetBurn
        expr: |
          (job:slo_latency_errors:ratio_rate1h > (14.4 * 0.01) and job:slo_latency_errors:ratio_rate5m > (14.4 * 0.01))
          or
          (job:slo_latency_errors:ratio_rate6h > (6 * 0.01) and job:slo_latency_errors:ratio_rate30m > (6 * 0.01))
        for: 2m
        labels:
          severity: page
          slo: latency
        annotations:
          summary: "web-app requests are too slow, fast enough to spend the latency budget within days"
          description: "{{ $value | humanizePercentage }} of requests take longer than 250 ms (SLO allows 1%)."
          runbook_url: "https://github.com/Carxion/Devops-and-platforming-groundwork/blob/main/kubernetes/OPERATIONS.md#troubleshooting-by-symptom"

      - alert: WebAppLatencyBudgetBurn
        expr: |
          (job:slo_latency_errors:ratio_rate1d > (3 * 0.01) and job:slo_latency_errors:ratio_rate2h > (3 * 0.01))
          or
          (job:slo_latency_errors:ratio_rate3d > (1 * 0.01) and job:slo_latency_errors:ratio_rate6h > (1 * 0.01))
        for: 15m
        labels:
          severity: ticket
          slo: latency
        annotations:
          summary: "web-app requests are slowly getting too slow for the latency SLO"
          description: "{{ $value | humanizePercentage }} of requests take longer than 250 ms (SLO allows 1%)."
          runbook_url: "https://github.com/Carxion/Devops-and-platforming-groundwork/blob/main/kubernetes/OPERATIONS.md#troubleshooting-by-symptom"

  - name: web-app-availability
    rules:
      # The SLO alerts need traffic to evaluate; this catches a service that's
      # gone completely, so there's nothing to measure.
      - alert: WebAppTargetDown
        expr: up{job="web-app"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Prometheus can't scrape web-app ({{ $labels.instance }})"
          description: "The scrape target has been down for 5 minutes. Check that the pods are running and ready."
          runbook_url: "https://github.com/Carxion/Devops-and-platforming-groundwork/blob/main/kubernetes/OPERATIONS.md#running-but-not-ready"
