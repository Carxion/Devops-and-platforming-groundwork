---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

# Allow SSH before setting the default policy or enabling ufw, so the
# connection Ansible is using is never blocked.
- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ firewall_ssh_port | string }}"
    proto: tcp
    comment: ssh

- name: Allow the other ports
  community.general.ufw:
    rule: allow
    # ufw writes ranges as START:END.
    port: "{{ item.split('/')[0] | replace('-', ':') }}"
    proto: "{{ item.split('/')[1] }}"
  loop: "{{ firewall_allow }}"

- name: Deny inbound and allow outbound by default
  community.general.ufw:
    default: "{{ item.policy }}"
    direction: "{{ item.direction }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Enable ufw
  community.general.ufw:
    state: enabled
  when: firewall_manage_services
