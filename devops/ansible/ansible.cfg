# Ansible reads the first ansible.cfg it finds: $ANSIBLE_CONFIG, then
# ./ansible.cfg, then ~/.ansible.cfg, then /etc/ansible/ansible.cfg. Running
# from this folder picks up this file. Check with: ansible-config dump --only-changed
[defaults]
inventory = inventory/example.yml
roles_path = roles
# Readable task results (multi-line output stays multi-line).
callback_result_format = yaml
# How many hosts to work on at once (the default is 5).
forks = 20
# Leave host key checking on: a changed host key is a reason to stop.
host_key_checking = true
# Find Python on each host without warning about it.
interpreter_python = auto_silent

[ssh_connection]
# Fewer SSH round trips per task. Needs "requiretty" off in sudoers (the default on current RHEL and Ubuntu).
pipelining = true
