[project]
name = "ticket-triage"
version = "0.1.0"
description = "An LLM app behind a gateway (LiteLLM), with managed prompts, tracing, and an evaluation gate (Langfuse)."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "CC-BY-4.0"
dependencies = [
    "langfuse>=5.2,<6",
    "openai>=3.52,<4",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
