# One-node kind cluster for the Helm lab, at the Kubernetes version the rest of
# the repository validates against. kindnet, kind's default network plugin,
# enforces NetworkPolicy, so the namespace's default-deny is real here.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: helm-lab
nodes:
  - role: control-plane
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
