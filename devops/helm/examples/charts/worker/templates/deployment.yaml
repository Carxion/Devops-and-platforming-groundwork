apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-lib.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-lib.labels" . | nindent 4 }}
  annotations:
    checkov.io/skip1: CKV_K8S_15=Image is pinned by digest, so IfNotPresent always runs the same image.
    checkov.io/skip2: CKV_K8S_11=No CPU limit by design; CPU requests guarantee a share and limits cause throttling.
    checkov.io/skip3: CKV_K8S_9=A worker serves no traffic, so there is nothing for a readiness probe to gate.
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "platform-lib.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform-lib.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "platform-lib.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "platform-lib.podSecurityContext" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "platform-lib.image" . }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              trap 'echo "{\"level\":\"info\",\"msg\":\"SIGTERM received, finishing current batch\"}"; exit 0' TERM
              while true; do
                echo '{"level":"info","msg":"processed batch"}'
                touch /tmp/heartbeat
                sleep 10 & wait $!
              done
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # No port to probe: the worker touches a heartbeat file each loop,
          # and liveness checks it was touched in the last minute.
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -n \"$(find /tmp/heartbeat -mmin -1)\""]
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            {{- include "platform-lib.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
