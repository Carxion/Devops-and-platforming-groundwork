{{- /*
`helm test` runs these. The test pod follows the same rules as the app (the
namespace enforces Pod Security "restricted"), and gets its own NetworkPolicy:
the namespace's default-deny would otherwise block its request.
*/}}
{{- $name := printf "%s-test" (include "platform-lib.fullname" .) | trunc 63 | trimSuffix "-" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-lib.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-1" # before the pod
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: helm-test
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    {{- include "platform-lib.dnsEgressRule" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "platform-lib.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.container.port }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: helm-test
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
    checkov.io/skip1: CKV_K8S_15=Image is pinned by digest, so IfNotPresent always runs the same image.
    checkov.io/skip2: CKV_K8S_11=A one-shot test pod; the memory limit bounds it.
    checkov.io/skip3: CKV_K8S_8=A one-shot test pod has nothing for a liveness probe to restart.
    checkov.io/skip4: CKV_K8S_9=A one-shot test pod serves no traffic.
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- include "platform-lib.podSecurityContext" . | nindent 4 }}
  containers:
    - name: readyz
      image: {{ printf "%s:%s@%s" .Values.tests.image.repository .Values.tests.image.tag .Values.tests.image.digest }}
      imagePullPolicy: IfNotPresent
      command: ["wget", "-q", "-O-", "-T", "5", "http://{{ include "platform-lib.fullname" . }}:{{ .Values.service.port }}{{ .Values.probes.readinessPath }}"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
      securityContext:
        {{- include "platform-lib.containerSecurityContext" . | nindent 8 }}
