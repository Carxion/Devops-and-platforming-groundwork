# Local observability lab: the web-app sample (podinfo) sending metrics,
# traces, and logs through an OpenTelemetry Collector to Prometheus, Tempo,
# and Loki, with Grafana and Alertmanager on top.
#
#   docker compose up -d                       # the stack
#   docker compose --profile traffic up -d     # plus generated traffic, including errors
#   docker compose down -v                     # stop and delete the data
#
# Grafana: http://localhost:3000   Prometheus: http://localhost:9090
# Alertmanager: http://localhost:9093   web-app: http://localhost:9898
#
# For a laptop only: Grafana allows anonymous admin access, and nothing is
# authenticated. Every port is bound to 127.0.0.1 so nothing is reachable
# from the network. Never run this configuration anywhere shared.

name: observability-lab

services:
  web-app:
    image: ghcr.io/stefanprodan/podinfo:6.15.0 # same app as devops/kubernetes/apps/web-app
    command:
      - ./podinfo
      - --port=9898
      - --port-metrics=9797
      - --level=info
      - --otel-service-name=web-app # turns on trace and log export
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,service.namespace=observability-lab
    ports:
      - "127.0.0.1:9898:9898"
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC, for apps running on your machine
      - "127.0.0.1:4318:4318" # OTLP HTTP
    depends_on:
      - tempo
      - loki
      - prometheus

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver # Tempo's metrics generator writes span metrics here
      - --web.enable-otlp-receiver # the collector forwards OTLP metrics here
      - --web.enable-lifecycle # lets you reload config with POST /-/reload
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/local-config.yaml"] # the image's built-in single-binary config
    volumes:
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  tempo:
    image: grafana/tempo:3.1.0
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  # Steady traffic with a share of errors and slow requests, so the
  # dashboards have data and the SLO alerts fire. Only with --profile traffic.
  traffic:
    image: grafana/k6:2.3.0
    profiles: ["traffic"]
    command: ["run", "--quiet", "/scripts/traffic.js"]
    environment:
      BASE_URL: http://web-app:9898
      RATE: "20"
      ERROR_PERCENT: "2"
      SLOW_PERCENT: "4"
    volumes:
      - ./traffic.js:/scripts/traffic.js:ro
    depends_on:
      - web-app

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
