# Unit tests for the web-app SLO rules:
#   promtool test rules devops/observability/prometheus/tests/web-app-slo.test.yaml
# Series values are per minute: '0+588x120' is a counter rising by 588 a
# minute (about 10 requests a second) for two hours.

rule_files:
  - ../rules/web-app-slo.yaml

evaluation_interval: 30s

tests:
  # 2% of requests fail: a fast burn. Both the page and the ticket fire.
  - name: fast availability burn pages
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_count{job="web-app", instance="web-app:9797", path="root", status="200"}'
        values: '0+588x120'
      - series: 'http_request_duration_seconds_count{job="web-app", instance="web-app:9797", path="root", status="500"}'
        values: '0+12x120'
      - series: 'http_request_duration_seconds_bucket{job="web-app", instance="web-app:9797", path="root", status="200", le="0.25"}'
        values: '0+588x120'
      - series: 'http_request_duration_seconds_bucket{job="web-app", instance="web-app:9797", path="root", status="500", le="0.25"}'
        values: '0+12x120'
      - series: 'up{job="web-app", instance="web-app:9797"}'
        values: '1x120'
    promql_expr_test:
      - expr: job:slo_availability_errors:ratio_rate5m
        eval_time: 70m
        exp_samples:
          - labels: 'job:slo_availability_errors:ratio_rate5m{job="web-app"}'
            value: 0.02
      - expr: job:slo_latency_errors:ratio_rate5m
        eval_time: 70m
        exp_samples:
          - labels: 'job:slo_latency_errors:ratio_rate5m{job="web-app"}'
            value: 0
    alert_rule_test:
      - alertname: WebAppAvailabilityBudgetBurn
        eval_time: 70m
        exp_alerts:
          - exp_labels:
              job: web-app
              severity: page
              slo: availability
            exp_annotations:
              summary: "web-app is failing requests fast enough to spend its monthly error budget within days"
              description: "2% of requests are failing with 5xx errors (SLO allows 0.1%)."
              runbook_url: "https://github.com/Carxion/Devops-and-platforming-groundwork/blob/main/kubernetes/OPERATIONS.md#troubleshooting-by-symptom"
          - exp_labels:
              job: web-app
              severity: ticket
              slo: availability
            exp_annotations:
              summary: "web-app is slowly spending its error budget faster than it accrues"
              description: "2% of requests are failing with 5xx errors (SLO allows 0.1%)."
              runbook_url: "https://github.com/Carxion/Devops-and-platforming-groundwork/blob/main/kubernetes/OPERATIONS.md#troubleshooting-by-symptom"
      - alertname: WebAppLatencyBudgetBurn
        eval_time: 70m
        exp_alerts: []
      - alertname: WebAppTargetDown
        eval_time: 70m
        exp_alerts: []

  # 20% of requests take longer than 250 ms, none fail: only the latency SLO burns.
  - name: slow requests page on latency, not availability
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_count{job="web-app", instance="web-app:9797", path="api_info", status="200"}'
        values: '0+600x120'
      - series: 'http_request_duration_seconds_bucket{job="web-app", instance="web-app:9797", path="api_info", status="200", le="0.25"}'
        values: '0+480x120'
    alert_rule_test:
      - alertname: WebAppLatencyBudgetBurn
        eval_time: 70m
        exp_alerts:
          - exp_labels:
              job: web-app
              severity: page
              slo: latency
            exp_annotations:
              summary: "web-app requests are too slow, fast enough to spend the latency budget within days"
              description: "20% of requests take longer than 250 ms (SLO allows 1%)."
              runbook_url: "https://github.com/Carxion/Devops-and-platforming-groundwork/blob/main/kubernetes/OPERATIONS.md#troubleshooting-by-symptom"
          - exp_labels:
              job: web-app
              severity: ticket
              slo: latency
            exp_annotations:
              summary: "web-app requests are slowly getting too slow for the latency SLO"
              description: "20% of requests take longer than 250 ms (SLO allows 1%)."
              runbook_url: "https://github.com/Carxion/Devops-and-platforming-groundwork/blob/main/kubernetes/OPERATIONS.md#troubleshooting-by-symptom"
      - alertname: WebAppAvailabilityBudgetBurn
        eval_time: 70m
        exp_alerts: []

  # 0.05% of requests fail, within the 0.1% budget. Failing health checks
  # don't count. Nothing fires.
  - name: errors within budget and failing health checks stay quiet
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_count{job="web-app", instance="web-app:9797", path="root", status="200"}'
        values: '0+1999x120'
      - series: 'http_request_duration_seconds_count{job="web-app", instance="web-app:9797", path="root", status="500"}'
        values: '0+1x120'
      - series: 'http_request_duration_seconds_count{job="web-app", instance="web-app:9797", path="healthz", status="500"}'
        values: '0+500x120'
      - series: 'http_request_duration_seconds_bucket{job="web-app", instance="web-app:9797", path="root", status="200", le="0.25"}'
        values: '0+1999x120'
      - series: 'http_request_duration_seconds_bucket{job="web-app", instance="web-app:9797", path="root", status="500", le="0.25"}'
        values: '0+1x120'
    promql_expr_test:
      - expr: job:slo_availability_errors:ratio_rate1h
        eval_time: 70m
        exp_samples:
          - labels: 'job:slo_availability_errors:ratio_rate1h{job="web-app"}'
            value: 0.0005
    alert_rule_test:
      - alertname: WebAppAvailabilityBudgetBurn
        eval_time: 70m
        exp_alerts: []
      - alertname: WebAppLatencyBudgetBurn
        eval_time: 70m
        exp_alerts: []

  # The scrape target disappears: no traffic metrics, so only TargetDown can fire.
  - name: target down
    interval: 1m
    input_series:
      - series: 'up{job="web-app", instance="web-app:9797"}'
        values: '0x10'
    alert_rule_test:
      - alertname: WebAppTargetDown
        eval_time: 4m
        exp_alerts: []
      - alertname: WebAppTargetDown
        eval_time: 6m
        exp_alerts:
          - exp_labels:
              job: web-app
              instance: web-app:9797
              severity: page
            exp_annotations:
              summary: "Prometheus can't scrape web-app (web-app:9797)"
              description: "The scrape target has been down for 5 minutes. Check that the pods are running and ready."
              runbook_url: "https://github.com/Carxion/Devops-and-platforming-groundwork/blob/main/kubernetes/OPERATIONS.md#running-but-not-ready"
