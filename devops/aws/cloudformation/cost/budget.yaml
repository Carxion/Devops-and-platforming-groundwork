AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Monthly cost budget with alerts at 80% of actual spend and 100% of
  forecasted spend, so overruns are noticed mid-month instead of on the
  invoice (guide section 3.5).

Parameters:
  BudgetName:
    Type: String
    Default: monthly-account-budget
  MonthlyLimitUsd:
    Type: Number
    Description: Expected monthly spend in USD.
    MinValue: 1
  AlertEmail:
    Type: String
    Description: Address that receives alerts. Use a team distribution list, not one person.
    AllowedPattern: '^[^@\s]+@[^@\s]+$'

Resources:
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Ref BudgetName
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
