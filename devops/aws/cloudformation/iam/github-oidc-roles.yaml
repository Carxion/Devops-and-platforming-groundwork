AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Short-lived AWS credentials for GitHub Actions through OIDC, with no stored
  access keys. A plan role trusted only by pull requests (read-only), and an
  apply role trusted only by jobs in a protected GitHub environment. The
  CloudFormation equivalent of devops/terraform/aws/github-oidc.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Repository }
        Parameters: [GitHubRepository, ApplyEnvironment]
      - Label: { default: Permissions }
        Parameters: [ApplyManagedPolicyArns, PermissionsBoundaryArn]
      - Label: { default: OIDC provider }
        Parameters: [CreateOidcProvider]

Parameters:
  GitHubRepository:
    Type: String
    Description: Repository allowed to assume the roles, as owner/name.
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
  ApplyEnvironment:
    Type: String
    Default: production
    Description: GitHub environment whose jobs may assume the apply role. Protect it with required reviewers.
  ApplyManagedPolicyArns:
    Type: CommaDelimitedList
    Description: Managed policies for the apply role. No default; decide deliberately what the pipeline may change.
  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: Permissions boundary for the apply role (see permissions-boundary.yaml). Strongly recommended.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: An account can have only one GitHub OIDC provider. Set false if it already exists.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]
  HasBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  PlanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-github-plan"
      Description: !Sub "GitHub Actions plan role for ${GitHubRepository} (pull requests, read-only)"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:pull_request"
      # ReadOnlyAccess is broad (it can read some data, such as S3 objects).
      # Replace it with a narrower policy if your program requires.
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess"

  ApplyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-github-apply"
      Description: !Sub "GitHub Actions apply role for ${GitHubRepository} (environment ${ApplyEnvironment} only)"
      MaxSessionDuration: 3600
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:environment:${ApplyEnvironment}"
      ManagedPolicyArns: !Ref ApplyManagedPolicyArns

Outputs:
  PlanRoleArn:
    Description: Use in pull request workflows (aws-actions/configure-aws-credentials).
    Value: !GetAtt PlanRole.Arn
  ApplyRoleArn:
    Description: Use only in jobs that declare the protected apply environment.
    Value: !GetAtt ApplyRole.Arn
