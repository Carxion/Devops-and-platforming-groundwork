# Dev: run every 15 minutes so changes are easy to observe.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sample-apps
resources:
  - ../../base
patches:
  - target:
      kind: CronJob
      name: scheduled-job
    patch: |-
      - op: replace
        path: /spec/schedule
        value: "*/15 * * * *"
