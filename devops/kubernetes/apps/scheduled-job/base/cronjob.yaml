apiVersion: batch/v1
kind: CronJob
metadata:
  name: scheduled-job
  annotations:
    checkov.io/skip1: CKV_K8S_15=Image is pinned by digest, so IfNotPresent always runs the same image.
    checkov.io/skip2: CKV_K8S_11=No CPU limit by design; CPU requests guarantee a share and limits cause throttling. See devops/kubernetes/README.md.
    checkov.io/skip3: CKV_K8S_8=A run-to-completion job is bounded by activeDeadlineSeconds instead of a liveness probe.
    checkov.io/skip4: CKV_K8S_9=A job serves no traffic, so there is nothing for a readiness probe to gate.
spec:
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid # never run two at once
  startingDeadlineSeconds: 600 # skip a run that couldn't start within 10 minutes
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600 # kill a run that hangs
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: scheduled-job
        spec:
          serviceAccountName: scheduled-job
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scheduled-job
              image: scheduled-job
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - echo '{"level":"info","msg":"nightly report generated"}'
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
