apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-app
  annotations:
    kubernetes.azure.com/tls-cert-keyvault-uri: https://example-kv.vault.azure.net/certificates/web-app
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts:
        - web-app.example.com
      secretName: keyvault-web-app # the add-on syncs the Key Vault certificate into this secret
  rules:
    - host: web-app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-app
                port:
                  name: http
