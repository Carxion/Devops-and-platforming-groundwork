apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-app-from-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web-app
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app-routing-system
      ports:
        - port: http
