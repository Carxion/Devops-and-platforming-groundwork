# .gitlab-ci.yml
# The component project's own pipeline: test every component on every change,
# and publish a release (and so a CI/CD Catalog version) for each semver tag.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages: [build, test, publish, release]

# Use the component from this exact commit, so a change is tested before it's released.
include:
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/container-image@$CI_COMMIT_SHA
    inputs:
      name: test-image
      context: tests/container-image
      dockerfile: tests/container-image/Dockerfile
      build_tags: [image-build]

# Releases need a semver tag, and the project must be marked as a CI/CD Catalog
# project (Settings > General) for the version to appear in the Catalog.
create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:v1.124.0
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  script: echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release $CI_COMMIT_TAG of the components in $CI_PROJECT_PATH."
