# .gitlab-ci.yml
# Pipeline for a Python service: the Items API in software/python/boilerplate/items-api,
# at the root of its own project. Lint, type-check, test, and audit dependencies,
# with results in the merge request; then build, scan, and push the image with
# the container-image component.

# One pipeline per change: merge request pipelines for merge requests, branch
# pipelines otherwise, and tag pipelines for releases. Never both for the same push.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  auto_cancel:
    on_new_commit: interruptible   # a new push cancels the older pipeline's interruptible jobs

stages: [check, build, test, publish]

include:
  - component: $CI_SERVER_FQDN/platform/ci-components/container-image@1.0.0
    inputs:
      name: items-api
      build_tags: [image-build]          # a runner that can run Buildah; see the component's README

default:
  interruptible: true

# Shared by the Python jobs: uv with the lock file, and a cache of downloaded
# packages keyed on that lock file.
.python:
  stage: check
  image: ghcr.io/astral-sh/uv:0.13.5-python3.14-trixie-slim
  variables:
    UV_FROZEN: "1"                       # install exactly what uv.lock says
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
    UV_LINK_MODE: copy
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache/]
  after_script:
    - uv cache prune --ci                # keep the cache small: drop what's cheap to rebuild

lint:
  extends: .python
  script:
    - uv run ruff format --check .
    - uv run ruff check --output-format=gitlab --output-file=gl-code-quality-report.json .
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json

typecheck:
  extends: .python
  script:
    - uv run mypy

test:
  extends: .python
  script:
    - >
      uv run --with pytest-cov pytest
      --junitxml=junit.xml
      --cov=items_api --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always                         # the reports matter most when tests fail
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

audit:
  extends: .python
  script:
    - uv run --with pip-audit pip-audit --skip-editable
  # A new advisory shouldn't block unrelated work in a merge request, but it
  # must block the default branch, where releases come from.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: true
    - when: on_success

# Image jobs from the component wait only for the checks they depend on.
items-api-build:
  needs: [lint, typecheck, test]
